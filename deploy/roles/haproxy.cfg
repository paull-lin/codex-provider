global
    log stdout format raw local0
    # Loopback only: drain/disable is an administrative capability, not a
    # service for every container attached to the private bridge.
    stats socket ipv4@127.0.0.1:9999 level admin

defaults
    mode http
    log global
    timeout connect 3s
    timeout client 1h
    timeout server 1h
    timeout tunnel 24h
    timeout check 3s
    # Pool owns retries. Never replay 5xx, timeouts, or a partly sent body.
    retries 1
    retry-on conn-failure
    option redispatch 1

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
    hold obsolete 1s

frontend ingress
    bind :9100
    # Match the provider routes in main.go:mux and native_codex.go, including
    # GET responses upgrades. Never rewrite native paths, bodies or headers.
    # A blanket /v1 or /k match would silently route future control APIs away
    # from the sole writer. Unknown paths and all dashboard/login traffic stay
    # on control, preserving the public URL's existing management surface.
    acl anthropic_path path /v1/messages /v1/messages/count_tokens
    acl provider_path path /v1/responses /v1/responses/compact /v1/chat/completions /v1/models
    acl native_path path_reg ^/k/[^/]+/backend-api/codex/(responses(/compact)?|models|images/(generations|edits)|memories/trace_summarize|alpha/search|realtime/calls)$
    use_backend anthropic if anthropic_path
    use_backend connections if provider_path or native_path
    default_backend control

backend control
    # Control /healthz requires the public key. TCP health avoids putting that
    # key in HAProxy config; Compose separately checks authenticated readiness.
    server control control:8317 check inter 2s resolvers docker init-addr libc,none

backend anthropic
    option httpchk
    http-check send meth GET uri /healthz ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server anthropic-adapter anthropic-adapter:8400 check inter 2s resolvers docker init-addr libc,none

backend connections
    option httpchk
    http-check send meth GET uri /healthz ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    # Keep backup selected after recovery. Failback explicitly readies main
    # and clears the table. Drain also clears it to prevent persistent reuse.
    stick-table type integer size 1
    stick on int(1)
    # A failed connect must mark primary down before redispatch; otherwise
    # the scheduler still sees an UP primary and never considers its backup.
    server connection-main connection-main:8317 check inter 2s fall 2 rise 2 observe layer4 error-limit 1 on-error mark-down resolvers docker init-addr libc,none
    server connection-backup connection-backup:8317 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none backup
